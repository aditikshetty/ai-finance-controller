version: '3.8'

services:
  backend:
    build: .
    container_name: fincontrol_backend_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data

  frontend:
    build: .
    container_name: fincontrol_frontend_ui
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data